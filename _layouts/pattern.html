---
layout: default
---
<article class="page pattern-page pattern-{{ page.phase }}">
  <div class="pattern-header">
    <span class="phase-label phase-{{ page.phase }}">{{ page.phase | upcase }}</span>
    <h1>{{ page.title }}</h1>
    {% if page.question %}
    <p class="strategic-question">{{ page.question }}</p>
    {% endif %}
  </div>
  {{ content }}
</article>
